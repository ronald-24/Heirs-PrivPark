name: heirs_privpark
description: A mobile app for renting private parking spaces.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌐 Réseau
  dio: ^5.4.0

  # 🔥 Firebase
  firebase_core: ^2.30.0
  firebase_auth: ^4.20.0
  firebase_messaging: ^14.9.0

  # 🗺️ Google Maps
  google_maps_flutter: ^2.5.0
  location: ^6.0.2

  # 💳 Paiements (Stripe)
  flutter_stripe: ^10.1.1

  # 🛠️ Utilitaires
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # 🖼️ UI & icônes
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
